<!doctype html><meta charset="utf-8"><title>Landmark visual audit</title><style>body{margin:0;background:#15171b;color:#eee;font:14px system-ui}header{padding:14px}main{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}section{position:relative}h2{position:absolute;top:0;left:8px;font-size:13px;background:#15171bdd;padding:6px}canvas{display:block;width:100%}</style><header id="status">Loading…</header><main></main><script type="module">
import*as T from'../vendor/three.module.js';import{GLTFLoader}from'../vendor/GLTFLoader.js';import{MeshoptDecoder}from'../vendor/meshopt_decoder.mjs';
const params=new URLSearchParams(location.search),index=await(await fetch('../circuits/index.json')).json(),ids=(params.get('ids')||index.circuits.map(c=>c.id).join(',')).split(','),features=(await(await fetch('../scenes/signatures.json')).json()).circuits;
if(params.has('only')&&ids.length===1){document.querySelector('main').style.cssText='display:block;max-width:960px;margin:auto'}
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setClearColor(0x15171b);renderer.setSize(1000,700,false);const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
for(const id of ids){const g=await loader.loadAsync('../scenes/'+id+'.glb?v=landmarks'),s=new T.Scene();s.add(g.scene,new T.HemisphereLight(0xdfe6f2,0x30343c,2.1));const sun=new T.DirectionalLight(0xffffff,1.5);sun.position.set(.6,1,.35);s.add(sun);const all=new T.Box3().setFromObject(g.scene),center=all.getCenter(new T.Vector3());center.y=0;const size=all.getSize(new T.Vector3()),views=[['Overview',center.toArray(),[.75,1,1],Math.max(size.x,size.z)*1.28]];
if(params.has('only'))views.length=0;
const selection=params.has('prefix')?[{name:params.get('label')||params.get('prefix'),meshPrefixes:[params.get('prefix')],kind:'landmark'}]:features[id].features;
if(!params.has('overview'))for(const f of selection.filter(f=>f.kind==='landmark'&&!f.note?.startsWith('Signature corner')&&!f.name.startsWith('Banked curve'))){const box=new T.Box3();g.scene.traverse(o=>{const n=g.parser.json.nodes[g.parser.associations.get(o)?.nodes]?.name||o.name;if(o.isMesh&&f.meshPrefixes.some(p=>n.startsWith(p)))box.union(new T.Box3().setFromObject(o));});const target=box.getCenter(new T.Vector3()),extent=box.getSize(new T.Vector3()),max=Math.max(extent.x,extent.y,extent.z),custom=params.get('dir')?.split(',').map(Number);views.push([f.name,target.toArray(),custom||[.6,.5,1],Math.max(40,max*1.8)]);}
for(const[label,at,dir,distance]of views){const el=document.createElement('section'),h=document.createElement('h2'),canvas=document.createElement('canvas');canvas.width=1000;canvas.height=700;h.textContent=id+' · '+label;el.append(h,canvas);document.querySelector('main').append(el);const target=new T.Vector3(...at),camera=new T.PerspectiveCamera(45,10/7,.1,20000);camera.position.copy(target).add(new T.Vector3(...dir).normalize().multiplyScalar(distance));camera.lookAt(target);renderer.render(s,camera);canvas.getContext('2d').drawImage(renderer.domElement,0,0);}g.scene.traverse(o=>{o.geometry?.dispose();if(o.material)for(const m of Array.isArray(o.material)?o.material:[o.material])m.dispose();});}
renderer.dispose();document.querySelector('#status').textContent=ids.join(' · ')+' — landmark audit complete';
</script>
